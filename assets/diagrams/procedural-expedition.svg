<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Discover the route. Choose how far to go.</title><desc id="desc">A discovered world portal admits a group to one server-owned seed. The run contains one to five generated floors. Scaling is committed at safe floor checkpoints; later floors do not create an endless ladder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="790" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Discover the route. Choose how far to go.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Procedural Dungeons · Level 60 · 5–20 players · A finite 1–5-floor seed.</tspan></text>
<rect x="60" y="150" width="320" height="110" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="220.0" y="186" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,160,296,37"><tspan x="220.0" dy="0">World portal</tspan></text>
<text x="220.0" y="223" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,200,296,52"><tspan x="220.0" dy="0">Discover an expedition</tspan></text>
<path d="M380 205H425" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="150" width="700" height="110" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="790.0" y="186" text-anchor="middle" class="label" style="font-size:24px;" data-fit="452,160,676,37"><tspan x="790.0" dy="0">Admitted group · One committed seed</tspan></text>
<text x="790.0" y="223" text-anchor="middle" class="body" style="font-size:21px;" data-fit="452,200,676,52"><tspan x="790.0" dy="0">5–20 players · Same run on reconnect</tspan></text>
<text x="600" y="315" text-anchor="middle" class="body" style="" data-fit="60,288,1080,35"><tspan x="600" dy="0">Each run contains 1–5 floors; later entrances may be discovered.</tspan></text>
<rect x="60" y="345" width="200" height="145" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="160.0" y="381" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,355,176,37"><tspan x="160.0" dy="0">Floor 1</tspan></text>
<text x="160.0" y="418" text-anchor="middle" class="body" style="font-size:19px;" data-fit="72,395,176,87"><tspan x="160.0" dy="0">Generated rooms</tspan><tspan x="160.0" dy="28">Packs and boss</tspan><tspan x="160.0" dy="28">Entry floor</tspan></text>
<rect x="280" y="345" width="200" height="145" rx="14" fill="#ffffff" stroke="#b8ccca" stroke-width="2"/>
