<text x="820.0" y="418" text-anchor="middle" class="body" style="font-size:19px;" data-fit="732,395,176,87"><tspan x="820.0" dy="0">Generated rooms</tspan><tspan x="820.0" dy="28">Packs and boss</tspan><tspan x="820.0" dy="28">If in the seed</tspan></text>
<rect x="940" y="345" width="200" height="145" rx="14" fill="#ffffff" stroke="#b8ccca" stroke-width="2"/>
<text x="1040.0" y="381" text-anchor="middle" class="label" style="font-size:24px;" data-fit="952,355,176,37"><tspan x="1040.0" dy="0">Floor 5</tspan></text>
<text x="1040.0" y="418" text-anchor="middle" class="body" style="font-size:19px;" data-fit="952,395,176,87"><tspan x="1040.0" dy="0">Generated rooms</tspan><tspan x="1040.0" dy="28">Packs and boss</tspan><tspan x="1040.0" dy="28">If in the seed</tspan></text>
<path d="M260 417H267" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M480 417H487" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M700 417H707" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M920 417H927" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="600" y="535" text-anchor="middle" class="body" style="" data-fit="60,508,1080,35"><tspan x="600" dy="0">Deeper floors: bounded tuning and selected additional mechanics.</tspan></text>
<rect x="60" y="575" width="520" height="125" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="611" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,585,496,37"><tspan x="320.0" dy="0">At floor checkpoints</tspan></text>
<text x="320.0" y="648" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,625,496,67"><tspan x="320.0" dy="0">Commit roster and scaling</tspan><tspan x="320.0" dy="28">No live-boss downscale</tspan></text>
<rect x="620" y="575" width="520" height="125" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="611" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,585,496,37"><tspan x="880.0" dy="0">Reward options to test</tspan></text>
<text x="880.0" y="648" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,625,496,67"><tspan x="880.0" dy="0">Gold, materials and discoveries</tspan><tspan x="880.0" dy="28">Rates and economic limits remain open</tspan></text>
<path d="M60 727H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="754" text-anchor="middle" class="small" style="" data-fit="60,734,1080,51"><tspan x="600" dy="0">Finite depth. Generated modules can repeat; unique layouts forever are not promised.</tspan></text>
