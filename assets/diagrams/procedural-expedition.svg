<text x="380.0" y="418" text-anchor="middle" class="body" style="font-size:19px;" data-fit="292,395,176,87"><tspan x="380.0" dy="0">Generated rooms</tspan><tspan x="380.0" dy="28">Packs and boss</tspan><tspan x="380.0" dy="28">If in the seed</tspan></text>
<rect x="500" y="345" width="200" height="145" rx="14" fill="#ffffff" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="381" text-anchor="middle" class="label" style="font-size:24px;" data-fit="512,355,176,37"><tspan x="600.0" dy="0">Floor 3</tspan></text>
<text x="600.0" y="418" text-anchor="middle" class="body" style="font-size:19px;" data-fit="512,395,176,87"><tspan x="600.0" dy="0">Generated rooms</tspan><tspan x="600.0" dy="28">Packs and boss</tspan><tspan x="600.0" dy="28">If in the seed</tspan></text>
<rect x="720" y="345" width="200" height="145" rx="14" fill="#ffffff" stroke="#b8ccca" stroke-width="2"/>
