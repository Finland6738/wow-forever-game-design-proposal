<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Recognize the right kind of achievement.</title><desc id="desc">Adventurer records instanced PvE, Explorer records world contribution and Honor records PvP participation. Gladiator belongs to arena competition and Challenger to timed dungeons. City service is separate reputation; Runes do not add another rank.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="790" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Recognize the right kind of achievement.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Participation histories and competitive results communicate different things.</tspan></text>
<rect x="60" y="155" width="340" height="140" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="230.0" y="191" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,165,316,37"><tspan x="230.0" dy="0">Adventurer</tspan></text>
<text x="230.0" y="228" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,205,316,82"><tspan x="230.0" dy="0">Instanced PvE</tspan><tspan x="230.0" dy="28">Eligible group contribution</tspan></text>
<rect x="430" y="155" width="340" height="140" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="191" text-anchor="middle" class="label" style="font-size:25px;" data-fit="442,165,316,37"><tspan x="600.0" dy="0">Explorer</tspan></text>
<text x="600.0" y="228" text-anchor="middle" class="body" style="font-size:20px;" data-fit="442,205,316,82"><tspan x="600.0" dy="0">Open-world contribution</tspan><tspan x="600.0" dy="28">Discovery and civic activity</tspan></text>
<rect x="800" y="155" width="340" height="140" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="970.0" y="191" text-anchor="middle" class="label" style="font-size:25px;" data-fit="812,165,316,37"><tspan x="970.0" dy="0">Honor</tspan></text>
<text x="970.0" y="228" text-anchor="middle" class="body" style="font-size:20px;" data-fit="812,205,316,82"><tspan x="970.0" dy="0">PvP participation</tspan><tspan x="970.0" dy="28">Separate eligibility rules</tspan></text>
<text x="600" y="342" text-anchor="middle" class="body" style="" data-fit="60,315,1080,35"><tspan x="600" dy="0">Competitive domains — distinct from accumulated participation</tspan></text>
<rect x="60" y="375" width="520" height="140" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="411" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,385,496,37"><tspan x="320.0" dy="0">Gladiator</tspan></text>
<text x="320.0" y="448" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,425,496,82"><tspan x="320.0" dy="0">Arena competitive standing</tspan><tspan x="320.0" dy="28">Format and rating policy remain open</tspan></text>
<rect x="620" y="375" width="520" height="140" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="411" text-anchor="middle" class="label" style="font-size:25px;" data-fit="632,385,496,37"><tspan x="880.0" dy="0">Challenger</tspan></text>
<text x="880.0" y="448" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,425,496,82"><tspan x="880.0" dy="0">Challenge Dungeon performance</tspan><tspan x="880.0" dy="28">Validated times and leaderboards</tspan></text>
<rect x="60" y="565" width="1080" height="110" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="601" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,575,1056,37"><tspan x="600.0" dy="0">City service has its own Warfare reputation.</tspan></text>
<text x="600.0" y="638" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,615,1056,52"><tspan x="600.0" dy="0">Runes show finite stat progress and history, without another rank.</tspan></text>
<path d="M60 727H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="754" text-anchor="middle" class="small" style="" data-fit="60,734,1080,51"><tspan x="600" dy="0">Recognition does not grant statistics. Participation totals are not skill ratings.</tspan></text>
</svg>
