<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">More ways to build a shared world.</title><desc id="desc">Professions offer reviewed sidegrades and projects, exploration offers lasting stories and discoveries, and short two- or three-player adventures offer cooperative play. Their reward boundaries avoid a required universal activity circuit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="690" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">More ways to build a shared world.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Professions, discoveries and short group adventures remain distinct choices.</tspan></text>
<rect x="60" y="155" width="340" height="160" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="230.0" y="191" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,165,316,37"><tspan x="230.0" dy="0">Professions</tspan></text>
<text x="230.0" y="228" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,205,316,102"><tspan x="230.0" dy="0">Recipes and specializations</tspan><tspan x="230.0" dy="28">Budgeted crafted alternatives</tspan><tspan x="230.0" dy="28">Optional economic projects</tspan></text>
<rect x="430" y="155" width="340" height="160" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="191" text-anchor="middle" class="label" style="font-size:24px;" data-fit="442,165,316,37"><tspan x="600.0" dy="0">Exploration and story</tspan></text>
<text x="600.0" y="228" text-anchor="middle" class="body" style="font-size:20px;" data-fit="442,205,316,102"><tspan x="600.0" dy="0">Secrets and puzzles</tspan><tspan x="600.0" dy="28">Class and regional stories</tspan><tspan x="600.0" dy="28">Meaningful world objectives</tspan></text>
<rect x="800" y="155" width="340" height="160" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="970.0" y="191" text-anchor="middle" class="label" style="font-size:23px;" data-fit="812,165,316,37"><tspan x="970.0" dy="0">Small-group adventures</tspan></text>
<text x="970.0" y="228" text-anchor="middle" class="body" style="font-size:20px;" data-fit="812,205,316,102"><tspan x="970.0" dy="0">Two or three players</tspan><tspan x="970.0" dy="28">Investigation and defense</tspan><tspan x="970.0" dy="28">Short cooperative encounters</tspan></text>
<path d="M230 315V385" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 315V385" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M970 315V385" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="400" width="1080" height="105" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="436" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,410,1056,37"><tspan x="600.0" dy="0">Useful choices, collections and shared accomplishments</tspan></text>
<text x="600.0" y="473" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,450,1056,47"><tspan x="600.0" dy="0">Reviewed sidegrades · Story milestones · Appropriate recognition</tspan></text>
<rect x="60" y="550" width="1080" height="65" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="586" text-anchor="middle" class="label" style="fill:#ffffff;font-size:23px;" data-fit="72,560,1056,37"><tspan x="600.0" dy="0">No universal weekly checklist or exclusive territorial PvE prerequisite.</tspan></text>
<path d="M60 627H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="654" text-anchor="middle" class="small" style="" data-fit="60,634,1080,51"><tspan x="600" dy="0">Keep rewards meaningful while preserving reasonable paths into group activities.</tspan></text>
</svg>
