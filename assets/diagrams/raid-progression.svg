<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A permanent baseline with independent raid progression</title>
  <desc id="desc">One lasting level-60 equipment baseline gives direct access to Updates A, B and C. Every update contains separate Normal and Veteran contextual tracks. No contextual power transfers between updates or difficulties.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#377d7a"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172d35; }
      .heading { font-size: 34px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 19px; fill: #425c63; }
      .track { font-size: 23px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#f1f5f1"/>
  <text x="60" y="60" class="heading">One lasting foundation. Many new adventures.</text>
  <text x="60" y="96" class="body">Conceptual progression model · all updates remain available</text>
  <rect x="60" y="135" width="1080" height="105" rx="16" fill="#173c43"/>
  <text x="600" y="176" text-anchor="middle" class="label" style="fill:#ffffff">Permanent level-60 equipment baseline</text>
  <text x="600" y="212" text-anchor="middle" class="body" style="fill:#d8e8e5">Accessible through quests, dungeons and professions</text>
  <g fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M230 240V298"/><path d="M600 240V298"/><path d="M970 240V298"/>
  </g>
  <g fill="#ffffff" stroke="#b8ccca" stroke-width="2">
    <rect x="60" y="310" width="340" height="325" rx="16"/>
    <rect x="430" y="310" width="340" height="325" rx="16"/>
    <rect x="800" y="310" width="340" height="325" rx="16"/>
  </g>
  <text x="230" y="351" text-anchor="middle" class="label">Update A raids</text>
  <text x="600" y="351" text-anchor="middle" class="label">Update B raids</text>
  <text x="970" y="351" text-anchor="middle" class="label">Update C raids</text>
  <g fill="#e4f1ed"><rect x="80" y="376" width="300" height="92" rx="10"/><rect x="450" y="376" width="300" height="92" rx="10"/><rect x="820" y="376" width="300" height="92" rx="10"/></g>
  <g fill="#f5ead5"><rect x="80" y="487" width="300" height="92" rx="10"/><rect x="450" y="487" width="300" height="92" rx="10"/><rect x="820" y="487" width="300" height="92" rx="10"/></g>
  <g text-anchor="middle">
    <text x="230" y="412" class="track">Normal</text><text x="230" y="445" class="small">Update A · Normal bonuses</text>
    <text x="600" y="412" class="track">Normal</text><text x="600" y="445" class="small">Update B · Normal bonuses</text>
    <text x="970" y="412" class="track">Normal</text><text x="970" y="445" class="small">Update C · Normal bonuses</text>
    <text x="230" y="523" class="track">Veteran</text><text x="230" y="556" class="small">Update A · Veteran bonuses</text>
    <text x="600" y="523" class="track">Veteran</text><text x="600" y="556" class="small">Update B · Veteran bonuses</text>
    <text x="970" y="523" class="track">Veteran</text><text x="970" y="556" class="small">Update C · Veteran bonuses</text>
    <text x="230" y="611" class="small">Direct entry to either difficulty</text>
    <text x="600" y="611" class="small">Direct entry to either difficulty</text>
    <text x="970" y="611" class="small">Direct entry to either difficulty</text>
  </g>
  <path d="M60 669H1140" stroke="#b8ccca" stroke-width="2"/>
  <text x="600" y="705" text-anchor="middle" class="body">No contextual power transfer between updates or difficulties.</text>
  <text x="600" y="735" text-anchor="middle" class="small">Items, appearances, achievements and each update's own progression remain yours.</text>
</svg>
