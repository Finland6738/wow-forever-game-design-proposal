<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">One world. Two combat relationships.</title><desc id="desc">Ordinary faction PvP stays independent. Different city flags add voluntary local hostility only when both are active in Warfare areas. Captured structures and NPCs use city and faction identity. Switching city offers a standing-preserving quarantine or a 50 percent departure-standing loss without a new quarantine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="920" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">One world. Two combat relationships.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Bivalent prototype · Separate participation, service and ordinary PvP state.</tspan></text>
<rect x="60" y="145" width="520" height="145" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="320.0" y="181" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,155,496,37"><tspan x="320.0" dy="0">Ordinary faction PvP</tspan></text>
<text x="320.0" y="218" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:20px;" data-fit="72,195,496,87"><tspan x="320.0" dy="0">Horde and Alliance</tspan><tspan x="320.0" dy="28">Apply ruleset and consent</tspan><tspan x="320.0" dy="28">No immunity from a city pledge</tspan></text>
<rect x="620" y="145" width="520" height="145" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="181" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,155,496,37"><tspan x="880.0" dy="0">Local city rivalry</tspan></text>
<text x="880.0" y="218" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,195,496,87"><tspan x="880.0" dy="0">Different city standards</tspan><tspan x="880.0" dy="28">Both flags ON in Warfare areas</tspan><tspan x="880.0" dy="28">Guilds may remain trans-city</tspan></text>
<rect x="60" y="335" width="1080" height="130" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="371" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,345,1056,37"><tspan x="600.0" dy="0">One territorial record: major faction + city stewardship</tspan></text>
<text x="600.0" y="408" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,385,1056,72"><tspan x="600.0" dy="0">Captured: city-style structure, banner, objective guards and boss</tspan><tspan x="600.0" dy="28">Neutral: regional NPC faction · Equivalent encounter budgets</tspan></text>
<rect x="60" y="510" width="520" height="170" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="546" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,520,496,37"><tspan x="320.0" dy="0">City switch: choose quarantine</tspan></text>
<text x="320.0" y="583" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,560,496,112"><tspan x="320.0" dy="0">Preserve accumulated city standing</tspan><tspan x="320.0" dy="28">Combat and group play allowed</tspan><tspan x="320.0" dy="28">Territorial claims / victory credit restricted</tspan><tspan x="320.0" dy="28">Duration remains open</tspan></text>
<rect x="620" y="510" width="520" height="170" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="546" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,520,496,37"><tspan x="880.0" dy="0">City switch: choose standing loss</tspan></text>
<text x="880.0" y="583" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,560,496,112"><tspan x="880.0" dy="0">Lose 50% of current departure standing</tspan><tspan x="880.0" dy="28">No new quarantine from this switch</tspan><tspan x="880.0" dy="28">Destination keeps its own ledger</tspan><tspan x="880.0" dy="28">Further claim safeguards still needed</tspan></text>
<rect x="60" y="725" width="1080" height="95" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="761" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,735,1056,37"><tspan x="600.0" dy="0">Base cosmetics stay owned; city variants require eligible service</tspan></text>
<text x="600.0" y="798" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:20px;" data-fit="72,775,1056,37"><tspan x="600.0" dy="0">Flag on/off through the NPC is not a city-service change and triggers neither penalty.</tspan></text>
<path d="M60 831H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="858" text-anchor="middle" class="small" style="" data-fit="60,838,1080,77"><tspan x="600" dy="0">Recommended: another switch cannot clear an existing quarantine.</tspan><tspan x="600" dy="28">Claim resolution, support rules, anti-trading checks and city art need prototype evidence.</tspan></text>
</svg>
