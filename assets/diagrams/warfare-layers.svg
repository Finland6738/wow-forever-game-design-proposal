<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">One world. Two combat relationships.</title><desc id="desc">Ordinary Horde/Alliance PvP remains independent. City rivalry adds hostility only between different active city flags inside Warfare areas. City service, the city flag and ordinary PvP state are separate. Camps can record major-faction ownership and city stewardship.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="850" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">One world. Two combat relationships.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Recommended bivalent Warfare prototype · Capture and support details remain open.</tspan></text>
<rect x="60" y="150" width="520" height="155" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="320.0" y="186" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,160,496,37"><tspan x="320.0" dy="0">Ordinary faction PvP</tspan></text>
<text x="320.0" y="223" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,200,496,97"><tspan x="320.0" dy="0">Horde and Alliance</tspan><tspan x="320.0" dy="28">Apply the ruleset and consent</tspan><tspan x="320.0" dy="28">No immunity from a city pledge</tspan></text>
<rect x="620" y="150" width="520" height="155" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="186" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,160,496,37"><tspan x="880.0" dy="0">Voluntary city rivalry</tspan></text>
<text x="880.0" y="223" text-anchor="middle" class="body" style="font-size:21px;" data-fit="632,200,496,97"><tspan x="880.0" dy="0">Different city standards</tspan><tspan x="880.0" dy="28">Both city flags ON</tspan><tspan x="880.0" dy="28">Inside Warfare areas only</tspan></text>
<text x="600" y="353" text-anchor="middle" class="body" style="" data-fit="60,325,1080,35"><tspan x="600" dy="0">Resolve hostility per pair; one flag never switches the entire battlefield.</tspan></text>
<rect x="60" y="385" width="340" height="120" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="230.0" y="421" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,395,316,37"><tspan x="230.0" dy="0">City service</tspan></text>
<text x="230.0" y="458" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,435,316,62"><tspan x="230.0" dy="0">Pledge and reputation</tspan></text>
<rect x="430" y="385" width="340" height="120" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="421" text-anchor="middle" class="label" style="font-size:24px;" data-fit="442,395,316,37"><tspan x="600.0" dy="0">City combat flag</tspan></text>
<text x="600.0" y="458" text-anchor="middle" class="body" style="font-size:20px;" data-fit="442,435,316,62"><tspan x="600.0" dy="0">Toggle through the city NPC</tspan></text>
<rect x="800" y="385" width="340" height="120" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="970.0" y="421" text-anchor="middle" class="label" style="font-size:24px;" data-fit="812,395,316,37"><tspan x="970.0" dy="0">Ordinary PvP state</tspan></text>
<text x="970.0" y="458" text-anchor="middle" class="body" style="font-size:21px;" data-fit="812,435,316,62"><tspan x="970.0" dy="0">The ruleset still applies</tspan></text>
<rect x="60" y="555" width="520" height="155" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="591" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,565,496,37"><tspan x="320.0" dy="0">Territorial record</tspan></text>
<text x="320.0" y="628" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,605,496,97"><tspan x="320.0" dy="0">Major-faction owner</tspan><tspan x="320.0" dy="28">City stewardship</tspan><tspan x="320.0" dy="28">Capture claims must be explicit</tspan></text>
<rect x="620" y="555" width="520" height="155" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="591" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,565,496,37"><tspan x="880.0" dy="0">City reward direction</tspan></text>
<text x="880.0" y="628" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,605,496,97"><tspan x="880.0" dy="0">Base objects remain owned</tspan><tspan x="880.0" dy="28">City variants need eligible service</tspan><tspan x="880.0" dy="28">Changing city loses reputation</tspan></text>
<path d="M60 761H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="788" text-anchor="middle" class="small" style="" data-fit="60,768,1080,77"><tspan x="600" dy="0">Turning off city combat is not changing the city served.</tspan><tspan x="600" dy="28">Rival cities need both flags; neutral allied players remain outside city hostility.</tspan></text>
</svg>
