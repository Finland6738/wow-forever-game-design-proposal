<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Gather a reserve. Choose how to commit it.</title><desc id="desc">Ranged actions gather small beings that follow their owner. They cannot be individually selected and have no HP. Swarmcaller uses insects for ranged damage, Soulbinder uses wisps or souls for ranged damage, and Sporekeeper uses a living colony for pure support. Ability details and numbers remain prototypes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="850" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Gather a reserve. Choose how to commit it.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Summoner · One class · Three selected specialization identities.</tspan></text>
<rect x="60" y="145" width="1080" height="90" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="181" text-anchor="middle" class="label" style="fill:#ffffff;font-size:25px;" data-fit="72,155,1056,37"><tspan x="600.0" dy="0">Ranged abilities gather a bounded reserve</tspan></text>
<text x="600.0" y="218" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,195,1056,32"><tspan x="600.0" dy="0">Capacity, generation and commitment costs still require tuning.</tspan></text>
<path d="M600 235V272" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="287" width="1080" height="90" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="323" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,297,1056,37"><tspan x="600.0" dy="0">Small beings follow their owner</tspan></text>
<text x="600.0" y="360" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,337,1056,32"><tspan x="600.0" dy="0">Not individually selectable · No HP · No follower-healing talents</tspan></text>
<path d="M230 377V415" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 377V415" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M970 377V415" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="430" width="340" height="145" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="230.0" y="466" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,440,316,37"><tspan x="230.0" dy="0">Swarmcaller</tspan></text>
<text x="230.0" y="503" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,480,316,87"><tspan x="230.0" dy="0">Ranged DPS · Insects</tspan><tspan x="230.0" dy="28">Sustain pressure or rupture</tspan></text>
<rect x="430" y="430" width="340" height="145" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="466" text-anchor="middle" class="label" style="font-size:25px;" data-fit="442,440,316,37"><tspan x="600.0" dy="0">Soulbinder</tspan></text>
<text x="600.0" y="503" text-anchor="middle" class="body" style="font-size:20px;" data-fit="442,480,316,87"><tspan x="600.0" dy="0">Ranged DPS · Souls / wisps</tspan><tspan x="600.0" dy="28">Bind, hold and release</tspan></text>
<rect x="800" y="430" width="340" height="145" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="970.0" y="466" text-anchor="middle" class="label" style="font-size:25px;" data-fit="812,440,316,37"><tspan x="970.0" dy="0">Sporekeeper</tspan></text>
<text x="970.0" y="503" text-anchor="middle" class="body" style="font-size:20px;" data-fit="812,480,316,87"><tspan x="970.0" dy="0">Pure support · Living colony</tspan><tspan x="970.0" dy="28">Prepare, protect and control</tspan></text>
<rect x="60" y="630" width="1080" height="100" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="666" text-anchor="middle" class="label" style="fill:#ffffff;font-size:25px;" data-fit="72,640,1056,37"><tspan x="600.0" dy="0">Order → Commit → Sustain, release or reclaim</tspan></text>
<text x="600.0" y="703" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:20px;" data-fit="72,680,1056,42"><tspan x="600.0" dy="0">A committed unit cannot also remain unused or pay out its full benefit twice.</tspan></text>
<path d="M60 761H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="788" text-anchor="middle" class="small" style="" data-fit="60,768,1080,77"><tspan x="600" dy="0">Counterplay targets the caster and the commanded effects.</tspan><tspan x="600" dy="28">One specialization has one role budget; the three trees are not combined at full strength.</tspan></text>
</svg>
