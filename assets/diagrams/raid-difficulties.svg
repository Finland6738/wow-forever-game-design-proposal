<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">Two difficulties. Two earned options.</title><desc id="desc">Normal and Veteran begin from the retained entry preset. They use separate equipment tracks. Each final boss teaches only its own talent, with one selected slot and matching-difficulty activation. Accessibility and progression duration are unvalidated tuning targets.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="810" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Two difficulties. Two earned options.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Shared entry budget. Independent local gear and reward-talent activation.</tspan></text>
<rect x="60" y="145" width="1080" height="85" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="181" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,155,1056,37"><tspan x="600.0" dy="0">Retained role-appropriate raid-entry preset · Stable permanent budget</tspan></text>
<path d="M320 230V270" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M880 230V270" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="285" width="520" height="190" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="321" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,295,496,37"><tspan x="320.0" dy="0">Normal</tspan></text>
<text x="320.0" y="358" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,335,496,132"><tspan x="320.0" dy="0">Normal contextual equipment</tspan><tspan x="320.0" dy="28">Final boss → Normal talent</tspan><tspan x="320.0" dy="28">Normal talent active only in Normal raids</tspan><tspan x="320.0" dy="28">Broad approachability target: ~70%</tspan></text>
<rect x="620" y="285" width="520" height="190" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="321" text-anchor="middle" class="label" style="font-size:25px;" data-fit="632,295,496,37"><tspan x="880.0" dy="0">Veteran</tspan></text>
<text x="880.0" y="358" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,335,496,132"><tspan x="880.0" dy="0">Veteran contextual equipment</tspan><tspan x="880.0" dy="28">Final boss → Veteran talent</tspan><tspan x="880.0" dy="28">Veteran talent active only in Veteran raids</tspan><tspan x="880.0" dy="28">More demanding cohort target: ~30%</tspan></text>
<rect x="60" y="530" width="1080" height="105" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="566" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,540,1056,37"><tspan x="600.0" dy="0">One selected raid talent. No cross-difficulty activation.</tspan></text>
<text x="600.0" y="603" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,580,1056,47"><tspan x="600.0" dy="0">Collecting both options requires both final-boss completions.</tspan></text>
<text x="600" y="683" text-anchor="middle" class="body" style="" data-fit="60,657,1080,38"><tspan x="600" dy="0">Veteran reference guild: 1–2 months of mechanical progression.</tspan></text>
<path d="M60 721H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="748" text-anchor="middle" class="small" style="" data-fit="60,728,1080,77"><tspan x="600" dy="0">Percentages are design targets, not quotas or measured clear rates.</tspan><tspan x="600" dy="28">Define the guild cohort, completion milestone and raid schedule during testing.</tspan></text>
</svg>
