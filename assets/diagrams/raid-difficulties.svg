<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Two difficulties. Two earned options.</title><desc id="desc">Normal and Veteran use separate contextual equipment. Each clear teaches only its own permanent ability; both completions are needed to collect both. Only one repertoire option can be equipped.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="830" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Two difficulties. Two earned options.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Normal and Veteran share an entry target, not a contextual equipment track.</tspan></text>
<rect x="60" y="140" width="1080" height="80" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="176" text-anchor="middle" class="label" style="fill:#ffffff;font-size:25px;" data-fit="72,150,1056,37"><tspan x="600.0" dy="0">Accessible permanent equipment baseline</tspan></text>
<path d="M320 220V265" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M880 220V265" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="280" width="520" height="190" rx="14" fill="#ffffff" stroke="#b8ccca" stroke-width="2"/>
<rect x="620" y="280" width="520" height="190" rx="14" fill="#ffffff" stroke="#b8ccca" stroke-width="2"/>
<text x="320" y="318" text-anchor="middle" class="label" style=""><tspan x="320" dy="0">Normal</tspan></text>
<text x="880" y="318" text-anchor="middle" class="label" style=""><tspan x="880" dy="0">Veteran</tspan></text>
<rect x="80" y="340" width="480" height="48" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<rect x="640" y="340" width="480" height="48" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="320" y="371" text-anchor="middle" class="body" style="" data-fit="92,347,456,35"><tspan x="320" dy="0">Normal contextual equipment</tspan></text>
<text x="880" y="371" text-anchor="middle" class="body" style="" data-fit="652,347,456,35"><tspan x="880" dy="0">Veteran contextual equipment</tspan></text>
<rect x="80" y="406" width="480" height="48" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<rect x="640" y="406" width="480" height="48" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320" y="437" text-anchor="middle" class="body" style="" data-fit="92,412,456,35"><tspan x="320" dy="0">Normal clear → Normal ability</tspan></text>
<text x="880" y="437" text-anchor="middle" class="body" style="" data-fit="652,412,456,35"><tspan x="880" dy="0">Veteran clear → Veteran ability</tspan></text>
<path d="M320 454V527" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M880 454V527" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="542" width="1080" height="110" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="578" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,552,1056,37"><tspan x="600.0" dy="0">Permanent ability collection</tspan></text>
<text x="600.0" y="615" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,592,1056,52"><tspan x="600.0" dy="0">Collecting both options requires both completions.</tspan></text>
<path d="M600 652V682" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="300" y="697" width="600" height="65" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="733" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="312,707,576,37"><tspan x="600.0" dy="0">ONE repertoire option equipped</tspan></text>
<path d="M60 767H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="794" text-anchor="middle" class="small" style="" data-fit="60,774,1080,51"><tspan x="600" dy="0">Veteran does not automatically teach Normal. Contextual equipment stays scoped.</tspan></text>
</svg>
