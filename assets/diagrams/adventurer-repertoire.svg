<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc">
<title id="title">Collect raid talents. Choose one.</title><desc id="desc">Each final boss teaches only its own difficulty talent. One active or passive option works only in raids of matching difficulty, including historical options in other same-difficulty raids. All world, dungeon and PvP contexts exclude these rewards.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="815" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Collect raid talents. Choose one.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">One reward slot, separate from ordinary class talent points.</tspan></text>
<rect x="60" y="145" width="520" height="140" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="181" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,155,496,37"><tspan x="320.0" dy="0">Normal final boss</tspan></text>
<text x="320.0" y="218" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,195,496,82"><tspan x="320.0" dy="0">Learn its Normal option</tspan><tspan x="320.0" dy="28">Use only in Normal raids</tspan></text>
<rect x="620" y="145" width="520" height="140" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="181" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,155,496,37"><tspan x="880.0" dy="0">Veteran final boss</tspan></text>
<text x="880.0" y="218" text-anchor="middle" class="body" style="font-size:21px;" data-fit="632,195,496,82"><tspan x="880.0" dy="0">Learn its Veteran option</tspan><tspan x="880.0" dy="28">Use only in Veteran raids</tspan></text>
<path d="M320 285V330H600V365" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M880 285V330H600" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="380" width="1080" height="110" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="416" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,390,1056,37"><tspan x="600.0" dy="0">Permanent library · ONE active OR passive option</tspan></text>
<text x="600.0" y="453" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,430,1056,52"><tspan x="600.0" dy="0">Historical talents can serve other raids of the same difficulty.</tspan></text>
<rect x="60" y="535" width="520" height="135" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="571" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,545,496,37"><tspan x="320.0" dy="0">Swap outside combat</tspan></text>
<text x="320.0" y="608" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,585,496,77"><tspan x="320.0" dy="0">Check encounter state and cooldowns</tspan><tspan x="320.0" dy="28">No stacked archived effects</tspan></text>
<rect x="620" y="535" width="520" height="135" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="571" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,545,496,37"><tspan x="880.0" dy="0">Inactive elsewhere</tspan></text>
<text x="880.0" y="608" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,585,496,77"><tspan x="880.0" dy="0">World · All dungeons · All PvP</tspan><tspan x="880.0" dy="28">Including Challenge, BGs and Arenas</tspan></text>
<path d="M60 726H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="753" text-anchor="middle" class="small" style="" data-fit="60,733,1080,77"><tspan x="600" dy="0">Veteran never automatically teaches Normal.</tspan><tspan x="600" dy="28">Ordinary class abilities retain their normal rules; only this reward slot is raid-only.</tspan></text>
</svg>
