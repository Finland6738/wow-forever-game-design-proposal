<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Different journeys. One lasting world.</title><desc id="desc">Post-60 preparation earns the retained raid-entry preset. Rune milestones add unlocks without statistics. Local gear stays scoped. One final-boss talent works only in matching-difficulty raids. Recognition rewards history and mastery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="760" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Different journeys. One lasting world.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">A stable entry set, earned choices and separate local progression.</tspan></text>
<rect x="60" y="150" width="340" height="165" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="230.0" y="186" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,160,316,37"><tspan x="230.0" dy="0">Entry preset</tspan></text>
<text x="230.0" y="223" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,200,316,107"><tspan x="230.0" dy="0">Finite post-60 preparation</tspan><tspan x="230.0" dy="28">Retained across seasons</tspan><tspan x="230.0" dy="28">Stable permanent budget</tspan></text>
<rect x="430" y="150" width="340" height="165" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="186" text-anchor="middle" class="label" style="font-size:24px;" data-fit="442,160,316,37"><tspan x="600.0" dy="0">Rune milestones</tspan></text>
<text x="600.0" y="223" text-anchor="middle" class="body" style="font-size:20px;" data-fit="442,200,316,107"><tspan x="600.0" dy="0">Reviewed completions</tspan><tspan x="600.0" dy="28">Targeted unlocks and history</tspan><tspan x="600.0" dy="28">No accumulated statistics</tspan></text>
<rect x="800" y="150" width="340" height="165" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="970.0" y="186" text-anchor="middle" class="label" style="font-size:24px;" data-fit="812,160,316,37"><tspan x="970.0" dy="0">Local raid equipment</tspan></text>
<text x="970.0" y="223" text-anchor="middle" class="body" style="font-size:20px;" data-fit="812,200,316,107"><tspan x="970.0" dy="0">Update-specific bonuses</tspan><tspan x="970.0" dy="28">Difficulty-specific scope</tspan><tspan x="970.0" dy="28">No contextual transfer</tspan></text>
<rect x="60" y="360" width="520" height="165" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="396" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,370,496,37"><tspan x="320.0" dy="0">Adventurer Repertoire</tspan></text>
<text x="320.0" y="433" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,410,496,107"><tspan x="320.0" dy="0">Final-boss talent collection · One slot</tspan><tspan x="320.0" dy="28">Normal → Normal raids only</tspan><tspan x="320.0" dy="28">Veteran → Veteran raids only</tspan></text>
<rect x="620" y="360" width="520" height="165" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="396" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,370,496,37"><tspan x="880.0" dy="0">Recognition</tspan></text>
<text x="880.0" y="433" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,410,496,107"><tspan x="880.0" dy="0">Participation and competitive results</tspan><tspan x="880.0" dy="28">Historical and community milestones</tspan><tspan x="880.0" dy="28">Cosmetics, titles and collections</tspan></text>
<rect x="60" y="570" width="1080" height="100" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="606" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,580,1056,37"><tspan x="600.0" dy="0">More choices without a higher permanent baseline</tspan></text>
<text x="600.0" y="643" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,620,1056,42"><tspan x="600.0" dy="0">Useful options still require interaction and encounter testing.</tspan></text>
<path d="M60 697H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="724" text-anchor="middle" class="small" style="" data-fit="60,704,1080,51"><tspan x="600" dy="0">Rune-use farming grants no power. Raid reward talents are inactive outside their scope.</tspan></text>
</svg>
