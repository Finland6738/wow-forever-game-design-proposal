<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Different journeys. One lasting world.</title><desc id="desc">Equipment preparation, fixed-ceiling Runes and scoped raid equipment are separate from a one-slot permanent ability collection and non-statistical recognition.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="740" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Different journeys. One lasting world.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Five channels with separate purposes and explicit limits.</tspan></text>
<rect x="60" y="155" width="340" height="160" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="230.0" y="191" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,165,316,37"><tspan x="230.0" dy="0">Equipment</tspan></text>
<text x="230.0" y="228" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,205,316,102"><tspan x="230.0" dy="0">Finite preparation</tspan><tspan x="230.0" dy="28">Reviewed sidegrades</tspan><tspan x="230.0" dy="28">Stable permanent range</tspan></text>
<rect x="430" y="155" width="340" height="160" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="191" text-anchor="middle" class="label" style="font-size:25px;" data-fit="442,165,316,37"><tspan x="600.0" dy="0">Runes</tspan></text>
<text x="600.0" y="228" text-anchor="middle" class="body" style="font-size:21px;" data-fit="442,205,316,102"><tspan x="600.0" dy="0">Finite stat development</tspan><tspan x="600.0" dy="28">Fixed lifetime ceiling</tspan><tspan x="600.0" dy="28">No new Rune rank</tspan></text>
<rect x="800" y="155" width="340" height="160" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="970.0" y="191" text-anchor="middle" class="label" style="font-size:25px;" data-fit="812,165,316,37"><tspan x="970.0" dy="0">Raid equipment</tspan></text>
<text x="970.0" y="228" text-anchor="middle" class="body" style="font-size:21px;" data-fit="812,205,316,102"><tspan x="970.0" dy="0">Update-specific bonuses</tspan><tspan x="970.0" dy="28">Difficulty-specific scope</tspan><tspan x="970.0" dy="28">No contextual transfer</tspan></text>
<rect x="60" y="360" width="520" height="135" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="396" text-anchor="middle" class="label" style="font-size:25px;" data-fit="72,370,496,37"><tspan x="320.0" dy="0">Adventurer Repertoire</tspan></text>
<text x="320.0" y="433" text-anchor="middle" class="body" style="font-size:21px;" data-fit="72,410,496,77"><tspan x="320.0" dy="0">Collect permanent raid options</tspan><tspan x="320.0" dy="28">Equip one active OR passive</tspan></text>
<rect x="620" y="360" width="520" height="135" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="396" text-anchor="middle" class="label" style="font-size:25px;" data-fit="632,370,496,37"><tspan x="880.0" dy="0">Recognition</tspan></text>
<text x="880.0" y="433" text-anchor="middle" class="body" style="font-size:21px;" data-fit="632,410,496,77"><tspan x="880.0" dy="0">Participation and competitive results</tspan><tspan x="880.0" dy="28">Collections and city service</tspan></text>
<rect x="60" y="550" width="1080" height="105" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="586" text-anchor="middle" class="label" style="fill:#ffffff;font-size:25px;" data-fit="72,560,1056,37"><tspan x="600.0" dy="0">A fixed long-term power envelope</tspan></text>
<text x="600.0" y="623" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,600,1056,47"><tspan x="600.0" dy="0">A larger library adds choice; it does not prove equal effective power.</tspan></text>
<path d="M60 677H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="704" text-anchor="middle" class="small" style="" data-fit="60,684,1080,51"><tspan x="600" dy="0">Numerical caps, local equipment and earned choices follow different rules.</tspan></text>
</svg>
