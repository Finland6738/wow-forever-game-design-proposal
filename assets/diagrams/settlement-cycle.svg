<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">NPC invasion, settlement defense and reconstruction</title>
  <desc id="desc">A peaceful settlement receives an invasion warning, followed by a defense against a hostile NPC faction. Victory keeps the village intact. Defeat causes local NPCs to withdraw, then players gather resources, rebuild structures and restore NPC service roles. Both paths return to a functioning village and a cooldown. Essential services have a fallback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172d35; }
      .heading { font-size: 34px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 19px; fill: #425c63; }
    </style>
  </defs>
  <rect width="1200" height="900" rx="20" fill="#f1f5f1"/>
  <text x="60" y="60" class="heading">Defend the village. Restore what is lost.</text>
  <text x="60" y="98" class="body">Cooperative PvE concept · attackers belong to hostile NPC factions</text>
  <g fill="#173c43">
    <rect x="60" y="145" width="280" height="100" rx="14"/>
    <rect x="460" y="145" width="280" height="100" rx="14"/>
    <rect x="860" y="145" width="280" height="100" rx="14"/>
  </g>
  <g text-anchor="middle" style="fill:#ffffff">
    <text x="200" y="185" class="label" style="fill:#ffffff">Peace</text><text x="200" y="220" class="body" style="fill:#d8e8e5">Ordinary village activity</text>
    <text x="600" y="185" class="label" style="fill:#ffffff">Warning</text><text x="600" y="220" class="body" style="fill:#d8e8e5">Prepare and evacuate</text>
    <text x="1000" y="185" class="label" style="fill:#ffffff">Defense</text><text x="1000" y="220" class="body" style="fill:#d8e8e5">Protect shared objectives</text>
  </g>
  <g fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M340 195H445"/><path d="M740 195H845"/>
    <path d="M1000 245V285H240V325"/><path d="M865 285V325"/>
  </g>
  <rect x="60" y="340" width="360" height="110" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
  <text x="240" y="381" text-anchor="middle" class="label">Defense succeeds</text>
  <text x="240" y="418" text-anchor="middle" class="body">Village stays intact</text>
  <rect x="590" y="340" width="550" height="110" rx="14" fill="#f5ead5" stroke="#ceba91" stroke-width="2"/>
  <text x="865" y="381" text-anchor="middle" class="label">Defense fails</text>
  <text x="865" y="418" text-anchor="middle" class="body">Damaged site · local NPCs withdraw</text>
  <path d="M865 450V505" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="590" y="520" width="550" height="120" rx="14" fill="#ffffff" stroke="#b8ccca" stroke-width="2"/>
  <text x="865" y="560" text-anchor="middle" class="label">Cooperative reconstruction</text>
  <text x="865" y="594" text-anchor="middle" class="body">Gather supplies · repair structures</text>
  <text x="865" y="623" text-anchor="middle" class="small">Recruit replacements · restore NPC services</text>
  <g fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"><path d="M240 450V695"/><path d="M865 640V695"/></g>
  <rect x="60" y="710" width="1080" height="95" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
  <text x="600" y="748" text-anchor="middle" class="label">A functioning village returns to peace</text>
  <text x="600" y="783" text-anchor="middle" class="body">Explorer civic recognition · one event allowance · recovery cooldown</text>
  <text x="600" y="855" text-anchor="middle" class="small">Essential services have a fallback. NPC assistance prevents indefinite damage.</text>
  <text x="600" y="883" text-anchor="middle" class="small">Defense and repair reward contribution, without combat stats or an incentive to lose.</text>
</svg>
