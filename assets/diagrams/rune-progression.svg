<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Earn milestones. Expand choices.</title><desc id="desc">Authored objectives grant validated milestones and declared unlocks or history. Repeated casts, prolonged boss phases and trash farming add no Rune statistics. No 0.01 percent progression, 1 percent spell cap or seasonal numerical increase is adopted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="700" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">Earn milestones. Expand choices.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Runes · Completion-based unlocks · No use counters or statistical allowance.</tspan></text>
<rect x="60" y="145" width="320" height="150" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="220.0" y="181" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,155,296,37"><tspan x="220.0" dy="0">Authored objective</tspan></text>
<text x="220.0" y="218" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,195,296,92"><tspan x="220.0" dy="0">Boss completion</tspan><tspan x="220.0" dy="28">Defined group objective</tspan><tspan x="220.0" dy="28">Declared reward</tspan></text>
<path d="M380 220H425" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="145" width="320" height="150" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="181" text-anchor="middle" class="label" style="font-size:24px;" data-fit="452,155,296,37"><tspan x="600.0" dy="0">Validate completion</tspan></text>
<text x="600.0" y="218" text-anchor="middle" class="body" style="font-size:20px;" data-fit="452,195,296,92"><tspan x="600.0" dy="0">Role-aware eligibility</tspan><tspan x="600.0" dy="28">One legitimate claim</tspan><tspan x="600.0" dy="28">No duplicate unlock</tspan></text>
<path d="M760 220H805" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="820" y="145" width="320" height="150" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="980.0" y="181" text-anchor="middle" class="label" style="font-size:24px;" data-fit="832,155,296,37"><tspan x="980.0" dy="0">Record the milestone</tspan></text>
<text x="980.0" y="218" text-anchor="middle" class="body" style="font-size:20px;" data-fit="832,195,296,92"><tspan x="980.0" dy="0">Targeted choice</tspan><tspan x="980.0" dy="28">Cosmetic or history</tspan><tspan x="980.0" dy="28">Scope shown clearly</tspan></text>
<rect x="60" y="350" width="1080" height="110" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="386" text-anchor="middle" class="label" style="fill:#ffffff;font-size:24px;" data-fit="72,360,1056,37"><tspan x="600.0" dy="0">No power per cast. No accumulating Rune stat pool.</tspan></text>
<text x="600.0" y="423" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:20px;" data-fit="72,400,1056,52"><tspan x="600.0" dy="0">Prolonging encounters, repeating casts or farming trash earns no extra Rune power.</tspan></text>
<rect x="60" y="505" width="520" height="95" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="541" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,515,496,37"><tspan x="320.0" dy="0">Raid talent rewards</tspan></text>
<text x="320.0" y="578" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,555,496,37"><tspan x="320.0" dy="0">Use the matching-difficulty raid slot</tspan></text>
<rect x="620" y="505" width="520" height="95" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="541" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,515,496,37"><tspan x="880.0" dy="0">No additional rank</tspan></text>
<text x="880.0" y="578" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,555,496,37"><tspan x="880.0" dy="0">Keep existing recognition domains</tspan></text>
<path d="M60 637H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="664" text-anchor="middle" class="small" style="" data-fit="60,644,1080,51"><tspan x="600" dy="0">An owned milestone does not override the reward’s context or eligibility rules.</tspan></text>
</svg>
