<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">A finite stat journey. A lasting record.</title><desc id="desc">Reviewed activities grant validated milestone progress toward a fixed lifetime Rune-stat ceiling. Before the ceiling there is finite numerical development; after it, history persists without extra stat overflow or a new seasonal cap.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#377d7a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d35}.heading{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#425c63}</style></defs>
<rect width="1200" height="760" rx="20" fill="#f1f5f1"/>
<text x="60" y="60" text-anchor="start" class="heading" style="" data-fit="60,22,1080,45"><tspan x="60" dy="0">A finite stat journey. A lasting record.</tspan></text>
<text x="60" y="98" text-anchor="start" class="body" style="" data-fit="60,75,1080,32"><tspan x="60" dy="0">Runes · One fixed lifetime allowance · No seasonal increase or Rune rank.</tspan></text>
<rect x="60" y="145" width="1080" height="90" rx="14" fill="#173c43" stroke="#173c43" stroke-width="2"/>
<text x="600.0" y="181" text-anchor="middle" class="label" style="fill:#ffffff;font-size:25px;" data-fit="72,155,1056,37"><tspan x="600.0" dy="0">Fixed lifetime Rune allowance</tspan></text>
<text x="600.0" y="218" text-anchor="middle" class="body" style="fill:#d8e8e5;font-size:21px;" data-fit="72,195,1056,32"><tspan x="600.0" dy="0">New content changes the available routes, not the numerical ceiling.</tspan></text>
<rect x="60" y="310" width="340" height="140" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="230.0" y="346" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,320,316,37"><tspan x="230.0" dy="0">Eligible activities</tspan></text>
<text x="230.0" y="383" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,360,316,82"><tspan x="230.0" dy="0">Reviewed sources</tspan><tspan x="230.0" dy="28">Meaningful participation</tspan></text>
<rect x="430" y="310" width="340" height="140" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="600.0" y="346" text-anchor="middle" class="label" style="font-size:24px;" data-fit="442,320,316,37"><tspan x="600.0" dy="0">Validated milestones</tspan></text>
<text x="600.0" y="383" text-anchor="middle" class="body" style="font-size:20px;" data-fit="442,360,316,82"><tspan x="600.0" dy="0">One authoritative claim</tspan><tspan x="600.0" dy="28">Role-aware contribution</tspan></text>
<rect x="800" y="310" width="340" height="140" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="970.0" y="346" text-anchor="middle" class="label" style="font-size:24px;" data-fit="812,320,316,37"><tspan x="970.0" dy="0">Finite stat progress</tspan></text>
<text x="970.0" y="383" text-anchor="middle" class="body" style="font-size:20px;" data-fit="812,360,316,82"><tspan x="970.0" dy="0">Apply the fixed budget</tspan><tspan x="970.0" dy="28">Exact amounts remain open</tspan></text>
<path d="M400 380H415" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M770 380H785" fill="none" stroke="#377d7a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="510" width="520" height="135" rx="14" fill="#f5ead5" stroke="#b8ccca" stroke-width="2"/>
<text x="320.0" y="546" text-anchor="middle" class="label" style="font-size:24px;" data-fit="72,520,496,37"><tspan x="320.0" dy="0">Before the ceiling</tspan></text>
<text x="320.0" y="583" text-anchor="middle" class="body" style="font-size:20px;" data-fit="72,560,496,77"><tspan x="320.0" dy="0">A bounded numerical journey</tspan><tspan x="320.0" dy="28">Acquisition pace still needs testing</tspan></text>
<rect x="620" y="510" width="520" height="135" rx="14" fill="#e4f1ed" stroke="#b8ccca" stroke-width="2"/>
<text x="880.0" y="546" text-anchor="middle" class="label" style="font-size:24px;" data-fit="632,520,496,37"><tspan x="880.0" dy="0">At the ceiling</tspan></text>
<text x="880.0" y="583" text-anchor="middle" class="body" style="font-size:20px;" data-fit="632,560,496,77"><tspan x="880.0" dy="0">Keep activity history</tspan><tspan x="880.0" dy="28">No overflow stats or new rank</tspan></text>
<path d="M60 671H1140" stroke="#b8ccca" stroke-width="2"/>
<text x="600" y="698" text-anchor="middle" class="small" style="" data-fit="60,678,1080,77"><tspan x="600" dy="0">The complete allowance belongs to the permanent envelope from the beginning.</tspan><tspan x="600" dy="28">Competitive profiles must explicitly define how Rune effects are handled.</tspan></text>
</svg>
