name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'wiki/**'
      - '.github/concept-announcements.json'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'wiki/**'
      - '.github/concept-announcements.json'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test wiki generation
        run: python3 -m unittest discover -s tests -v

      - name: Validate documents and build reading pages
        run: python3 scripts/sync_wiki.py --output "$RUNNER_TEMP/wiki-preview"

      - name: Publish wiki
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_REPOSITORY: ${{ github.repository }}
          WIKI_SERVER: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          wiki_path="$RUNNER_TEMP/published-wiki"
          git clone "$WIKI_SERVER/$WIKI_REPOSITORY.wiki.git" "$wiki_path"
          python3 scripts/sync_wiki.py --output "$wiki_path"
          git -C "$wiki_path" config user.name "github-actions[bot]"
          git -C "$wiki_path" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wiki_path" add --all
          if git -C "$wiki_path" diff --cached --quiet; then
            echo "Wiki already matches the source."
            exit 0
          fi
          source_revision="$(git rev-parse --short=12 HEAD)"
          git -C "$wiki_path" commit -m "docs: sync wiki from $source_revision"
          git -C "$wiki_path" push origin HEAD

  announce-concept-update:
    needs: build-and-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Check out the published source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Announce changed concepts without duplicates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/announce_concept_changes.py --publish
